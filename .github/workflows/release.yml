name: Release (Windows)

# macOS builds are signed and packed locally (scripts/package-macos.sh) and attached
# to the release by hand; this workflow adds the Windows builds once it is published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package
        id: package
        shell: pwsh
        run: |
          $zip = ./scripts/package-windows.ps1 -Runtime ${{ matrix.runtime }} | Select-Object -Last 1
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" "${{ steps.package.outputs.zip }}" --clobber
